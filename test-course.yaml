# Временный тестовый курс: проверить озвучку в приложении на телефоне. Удалим вместе с тестовой страницей.
# Добавлять в приложение по ссылке:
#   https://raw.githubusercontent.com/color-zebra/frontend-quiz-audio/main/test-course.yaml
title: Проверка озвучки
lessons:
  - id: check-pages
    topic: Проверка
    title: Аудио с сайта (GitHub Pages)
    audio: https://color-zebra.github.io/frontend-quiz-audio/test.mp3
    body: |
      Звук — трёхминутная склейка пробы. Что проверить:

      1. Нажми «Слушать урок», выключи экран, подожди минуту — звук идёт.
      2. В шторке и на экране блокировки — название урока и «Проверка озвучки», пауза и перемотка работают,
         полоса совпадает со временем в приложении (в том числе после паузы с экрана блокировки).
      3. Уйди в оглавление и на главную — звук продолжается, внизу мини-плеер.
      4. Скорость: кнопка «1×» в плеере, звук ускоряется.
      5. Останови посреди, закрой приложение, открой снова — урок предлагает «Продолжить слушать · с …».
  - id: check-raw
    topic: Проверка
    title: Аудио по сырой ссылке GitHub
    # Путь относительно файла курса: при добавлении по raw-ссылке — raw.githubusercontent.com.
    audio: test.mp3
    body: |
      Тот же звук, но по сырой ссылке GitHub. Что проверить про работу без сети:

      1. В оглавлении нажми «Скачать аудио» — дождись «Аудио на телефоне».
      2. Включи режим полёта, открой урок, «Слушать урок», перемотай ползунком — играет.
      3. Выключи режим полёта, в оглавлении «Удалить аудио», снова режим полёта, «Слушать урок» — плеер пишет
         «Нет сети, а аудио этого урока не скачано». Выключи режим полёта — «играть» продолжает.
      4. В кабинете видно, сколько места занимает аудио, пока оно скачано.
questions:
  - id: check-q1
    topic: Проверка
    level: junior
    question: Звук играл с выключенным экраном?
    options:
      - text: 'Да'
        correct: true
        why: 'Так и задумано.'
      - text: 'Нет'
        why: 'Напиши, на каком шаге перестал.'
